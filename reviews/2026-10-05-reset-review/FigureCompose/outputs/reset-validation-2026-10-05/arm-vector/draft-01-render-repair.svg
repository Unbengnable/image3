<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="178mm" height="82mm" viewBox="0 0 1780 820">
  <title>MAE pre-training: sparse encoding and masked reconstruction</title>
  <desc>A native vector mountain-lake image is divided into sixteen patches. Visible patches one, six, eleven and twelve feed an encoder. Four encoded tokens and twelve learned mask tokens are restored to sixteen positions. A smaller decoder predicts sixteen patches. MSE compares original and predicted pixels only at twelve masked positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#293849"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ad5925"/></marker>
    <symbol id="scene" viewBox="0 0 256 256">
      <rect width="256" height="256" fill="#dceaf0"/>
      <circle cx="43" cy="36" r="19" fill="#efbd54"/>
      <path d="M0 137L61 51L119 121L157 71L224 143L256 106V180H0Z" fill="#8aabb9"/>
      <path d="M61 51L44 76L61 71L76 81Z M157 71L139 96L157 88L174 100Z" fill="#faf8ee"/>
      <path d="M0 142L79 103L133 150L193 109L256 151V182H0Z" fill="#587d86"/>
      <path d="M0 169Q61 146 123 171T256 162V256H0Z" fill="#8ac1c8"/>
      <path d="M9 190H62 M74 202H131 M115 226H184 M26 238H91 M160 187H194" stroke="#d8eff0" stroke-width="4" fill="none"/>
      <path d="M256 151Q218 176 203 205Q183 235 121 256H256Z" fill="#789464"/>
      <path d="M225 124V229" stroke="#5a5945" stroke-width="7"/>
      <path d="M225 106L200 155H213L193 181H215L201 205H250L236 181H256L237 155H250Z" fill="#285d50"/>
      <path d="M0 249Q36 227 71 246L96 256H0Z" fill="#5b7d64"/>
    </symbol>
    <symbol id="prediction-scene" viewBox="0 0 256 256">
      <rect width="256" height="256" fill="#e6eef0"/>
      <circle cx="46" cy="38" r="17" fill="#e8c77a"/>
      <path d="M0 142L60 58L121 126L158 83L224 147L256 116V183H0Z" fill="#9db6c0"/>
      <path d="M60 58L46 80L60 75L74 85Z M158 83L144 102L158 96L172 106Z" fill="#faf8ee"/>
      <path d="M0 148L80 113L137 156L194 123L256 158V183H0Z" fill="#77989c"/>
      <path d="M0 175Q59 159 128 177T256 169V256H0Z" fill="#a4ccd0"/>
      <path d="M12 193H71 M84 213H137 M121 235H178 M31 244H91" stroke="#e6f2f0" stroke-width="5" fill="none"/>
      <path d="M256 161Q222 184 210 212Q185 237 131 256H256Z" fill="#9baa7e"/>
      <path d="M224 139V228" stroke="#74745c" stroke-width="6"/>
      <path d="M224 120L203 163H213L198 187H215L206 208H246L235 187H251L235 164H247Z" fill="#518174"/>
      <path d="M0 250Q37 236 72 249L89 256H0Z" fill="#819d83"/>
    </symbol>
    <symbol id="grid" viewBox="0 0 256 256"><path d="M64 0V256M128 0V256M192 0V256M0 64H256M0 128H256M0 192H256" fill="none" stroke="#ffffff" stroke-width="2"/><rect x="1" y="1" width="254" height="254" fill="none" stroke="#51636c" stroke-width="2"/></symbol>
    <symbol id="crop-1" viewBox="0 0 64 64"><use xlink:href="#scene" width="256" height="256"/></symbol>
    <symbol id="crop-6" viewBox="64 64 64 64"><use xlink:href="#scene" width="256" height="256"/></symbol>
    <symbol id="crop-11" viewBox="128 128 64 64"><use xlink:href="#scene" width="256" height="256"/></symbol>
    <symbol id="crop-12" viewBox="192 128 64 64"><use xlink:href="#scene" width="256" height="256"/></symbol>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#243341;font-size:27px}
    .head{font-size:30px;font-weight:600}.small{font-size:23px}.id{font-size:23px;font-weight:600;fill:#243341}
    .route{fill:none;stroke:#293849;stroke-width:2.5;marker-end:url(#arrow)}
    .latent{fill:#3477a9;stroke:#245c85;stroke-width:1.5}.mask{fill:#e4e6e9;stroke:#b0b5bd;stroke-width:1.5}
    .z{fill:white;font-size:27px}.m{fill:#596371;font-size:27px}.loss{fill:none;stroke:#be682b;stroke-width:4}
  </style>
  <rect width="1780" height="820" fill="white"/>
  <text x="35" y="53" class="head">MAE pre-training</text>
  <text x="35" y="108">75% masked</text>
  <rect x="1290" y="83" width="25" height="21" fill="#3477a9"/><text x="1325" y="103" class="small">encoded</text>
  <rect x="1457" y="83" width="25" height="21" fill="#e4e6e9" stroke="#b0b5bd"/><text x="1492" y="103" class="small">mask token</text>
  <text x="35" y="174" class="head">Image</text>
  <g id="source-image" transform="translate(35 205)"><use xlink:href="#scene" width="256" height="256"/><use xlink:href="#grid" width="256" height="256"/></g>
  <text x="163" y="499" text-anchor="middle">16 patches</text>
  <path class="route" d="M301 326H328"/>
  <text x="351" y="174" class="head">Keep 4</text>
  <g id="visible-patches">
    <g id="visible-1" data-patch="1" transform="translate(350 235)"><use xlink:href="#crop-1" width="64" height="64"/><rect width="64" height="64" fill="none" stroke="#3477a9" stroke-width="3"/><rect x="2" y="42" width="30" height="21" fill="#fff"/><text x="7" y="61" class="id">1</text></g>
    <g id="visible-6" data-patch="6" transform="translate(430 235)"><use xlink:href="#crop-6" width="64" height="64"/><rect width="64" height="64" fill="none" stroke="#3477a9" stroke-width="3"/><rect x="2" y="42" width="30" height="21" fill="#fff"/><text x="7" y="61" class="id">6</text></g>
    <g id="visible-11" data-patch="11" transform="translate(350 325)"><use xlink:href="#crop-11" width="64" height="64"/><rect width="64" height="64" fill="none" stroke="#3477a9" stroke-width="3"/><rect x="2" y="42" width="32" height="21" fill="#fff"/><text x="4" y="61" class="id">11</text></g>
    <g id="visible-12" data-patch="12" transform="translate(430 325)"><use xlink:href="#crop-12" width="64" height="64"/><rect width="64" height="64" fill="none" stroke="#3477a9" stroke-width="3"/><rect x="2" y="42" width="32" height="21" fill="#fff"/><text x="4" y="61" class="id">12</text></g>
  </g>
  <path class="route" d="M502 326H526"/>
  <g id="encoder"><rect x="535" y="222" width="145" height="185" rx="11" fill="#eaf3f7" stroke="#245c85" stroke-width="2.5"/><text x="607.5" y="306" text-anchor="middle" class="head">Encoder</text><text x="607.5" y="346" text-anchor="middle">4 tokens</text></g>
  <text x="607.5" y="452" text-anchor="middle" class="small">+ positions</text>
  <path class="route" d="M689 326H719"/>
  <g id="encoded-tokens">
    <rect id="latent-1" data-patch="1" x="730" y="234" width="65" height="29" rx="3" class="latent"/><text x="762.5" y="257" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">1</tspan></text>
    <rect id="latent-6" data-patch="6" x="730" y="282" width="65" height="29" rx="3" class="latent"/><text x="762.5" y="305" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">6</tspan></text>
    <rect id="latent-11" data-patch="11" x="730" y="330" width="65" height="29" rx="3" class="latent"/><text x="762.5" y="353" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">11</tspan></text>
    <rect id="latent-12" data-patch="12" x="730" y="378" width="65" height="29" rx="3" class="latent"/><text x="762.5" y="401" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">12</tspan></text>
  </g>
  <path class="route" d="M805 326H852"/>
  <text x="998" y="174" text-anchor="middle" class="head">Restore positions</text>
  <g id="decoder-input" transform="translate(870 205)">
    <g id="decoder-1" data-patch="1" data-kind="visible"><rect width="62" height="62" class="latent"/><text x="31" y="40" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">1</tspan></text></g>
    <g id="decoder-2" data-patch="2" data-kind="mask" transform="translate(64 0)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-3" data-patch="3" data-kind="mask" transform="translate(128 0)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-4" data-patch="4" data-kind="mask" transform="translate(192 0)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-5" data-patch="5" data-kind="mask" transform="translate(0 64)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-6" data-patch="6" data-kind="visible" transform="translate(64 64)"><rect width="62" height="62" class="latent"/><text x="31" y="40" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">6</tspan></text></g>
    <g id="decoder-7" data-patch="7" data-kind="mask" transform="translate(128 64)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-8" data-patch="8" data-kind="mask" transform="translate(192 64)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-9" data-patch="9" data-kind="mask" transform="translate(0 128)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-10" data-patch="10" data-kind="mask" transform="translate(64 128)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-11" data-patch="11" data-kind="visible" transform="translate(128 128)"><rect width="62" height="62" class="latent"/><text x="31" y="40" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">11</tspan></text></g>
    <g id="decoder-12" data-patch="12" data-kind="visible" transform="translate(192 128)"><rect width="62" height="62" class="latent"/><text x="31" y="40" text-anchor="middle" class="z">z<tspan baseline-shift="sub" font-size="18">12</tspan></text></g>
    <g id="decoder-13" data-patch="13" data-kind="mask" transform="translate(0 192)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-14" data-patch="14" data-kind="mask" transform="translate(64 192)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-15" data-patch="15" data-kind="mask" transform="translate(128 192)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
    <g id="decoder-16" data-patch="16" data-kind="mask" transform="translate(192 192)"><rect width="62" height="62" class="mask"/><text x="31" y="40" text-anchor="middle" class="m">M</text></g>
  </g>
  <text x="998" y="499" text-anchor="middle">4 encoded + 12 masks</text>
  <g id="mask-token-source"><rect x="925" y="543" width="146" height="51" rx="6" class="mask"/><text x="998" y="578" text-anchor="middle">12 × M</text><path class="route" d="M998 533V516"/></g>
  <path class="route" d="M1140 326H1184"/>
  <g id="decoder"><rect x="1195" y="255" width="120" height="123" rx="9" fill="#edf4f7" stroke="#245c85" stroke-width="2.5"/><text x="1255" y="303" text-anchor="middle" class="small">Lightweight</text><text x="1255" y="340" text-anchor="middle">decoder</text></g>
  <text x="1255" y="422" text-anchor="middle" class="small">+ positions</text>
  <path class="route" d="M1326 326H1395"/>
  <text x="1538" y="174" text-anchor="middle" class="head">Predict pixels</text>
  <g id="predicted-image" transform="translate(1410 205)"><use xlink:href="#prediction-scene" width="256" height="256"/><use xlink:href="#grid" width="256" height="256"/>
    <g id="masked-loss-locations">
      <rect id="loss-2" data-patch="2" x="65" y="1" width="62" height="62" class="loss"/><rect id="loss-3" data-patch="3" x="129" y="1" width="62" height="62" class="loss"/><rect id="loss-4" data-patch="4" x="193" y="1" width="62" height="62" class="loss"/>
      <rect id="loss-5" data-patch="5" x="1" y="65" width="62" height="62" class="loss"/><rect id="loss-7" data-patch="7" x="129" y="65" width="62" height="62" class="loss"/><rect id="loss-8" data-patch="8" x="193" y="65" width="62" height="62" class="loss"/>
      <rect id="loss-9" data-patch="9" x="1" y="129" width="62" height="62" class="loss"/><rect id="loss-10" data-patch="10" x="65" y="129" width="62" height="62" class="loss"/>
      <rect id="loss-13" data-patch="13" x="1" y="193" width="62" height="62" class="loss"/><rect id="loss-14" data-patch="14" x="65" y="193" width="62" height="62" class="loss"/><rect id="loss-15" data-patch="15" x="129" y="193" width="62" height="62" class="loss"/><rect id="loss-16" data-patch="16" x="193" y="193" width="62" height="62" class="loss"/>
    </g>
  </g>
  <text x="1538" y="499" text-anchor="middle">16 patch predictions</text>
  <path d="M1538 515V611" fill="none" stroke="#ad5925" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <g id="supervision-route"><path d="M163 523V642H1418" fill="none" stroke="#ad5925" stroke-width="2.5" marker-end="url(#orange-arrow)"/><text x="163" y="686" text-anchor="middle" class="small" fill="#ad5925">target only</text><text x="482" y="628" class="small">Original pixels</text></g>
  <g id="masked-loss"><rect x="1428" y="622" width="220" height="89" rx="8" fill="#fbf2e9" stroke="#ad5925" stroke-width="2.5"/><text x="1538" y="657" text-anchor="middle">Masked MSE</text><text x="1538" y="693" text-anchor="middle">12 patches</text></g>
  <rect x="1428" y="753" width="26" height="23" class="loss"/><text x="1467" y="774" class="small">loss locations</text>
</svg>
